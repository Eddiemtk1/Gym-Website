<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Hours Report – GymFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared-supabase.js"></script>
  <script src="auth-role.js"></script>
  <script src="shared-nav.js"></script>
  <link href="shared-nav.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="shared-theme.js"></script>
  <script id="tailwind-config">
    applyGymflowTailwindConfig();
  </script>
  <link href="shared-theme.css" rel="stylesheet">
</head>

<body class="s14-page s14-app bg-background text-on-surface font-body antialiased">
  <div class="relative flex min-h-screen w-full flex-col bg-background overflow-x-hidden">
    <div class="flex h-full grow flex-col">

      <!-- Header -->
      <header class="site-nav sticky top-0 z-50 relative">
        <div class="flex items-center justify-between gap-4 px-6 lg:px-10 py-3">
          <a href="index.html" class="flex items-center gap-4 text-primary hover:opacity-90 transition-opacity">
            <div class="size-6">
              <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="currentColor" fill-rule="evenodd"></path>
              </svg>
            </div>
            <h2 class="text-white font-headline text-xl font-black leading-tight tracking-[-0.03em]">GYMFLOW</h2>
          </a>

          <div class="flex items-center gap-3">
            <button id="menu-toggle" aria-expanded="false" aria-controls="menu-panel" class="menu-toggle">
              <span id="menu-icon" class="material-symbols-outlined" style="font-size: 18px;">menu</span>
              <span>Menu</span>
            </button>

          <a href="profile.html" class="hidden sm:flex items-center gap-3 pr-4 border-r border-white/10 hover:opacity-80 transition-opacity">
            <div class="text-right">
              <p id="header-name" class="font-headline font-bold text-white text-xs">Loading...</p>
              <p id="header-role-label" class="text-[8px] text-primary uppercase tracking-[0.1em] font-bold">Member</p>
            </div>
            <div class="size-8 rounded-full border border-primary overflow-hidden bg-surface-variant flex items-center justify-center">
              <img id="header-avatar-img" src="" alt="Profile" class="w-full h-full object-cover hidden">
              <span id="header-avatar-initial" class="font-headline text-sm font-bold text-primary">?</span>
            </div>
          </a>
          <button id="logout-btn" title="Sign out"
            class="flex items-center gap-2 px-4 h-10 bg-surface-variant text-on-surface-variant hover:bg-white hover:text-black transition-colors text-xs font-bold uppercase tracking-widest">
            <span class="material-symbols-outlined" style="font-size: 18px;">logout</span>
            <span class="hidden sm:inline">Sign out</span>
          </button>
        </div>
        </div>

        <div id="menu-panel" class="hidden absolute right-6 top-full z-50 mt-2 w-[30%] min-w-[260px] max-w-[520px] border border-white/10 bg-background/95 p-3 shadow-[0_20px_45px_rgba(0,0,0,0.45)]">
          <nav id="main-nav" class="grid grid-cols-1 gap-3"></nav>
        </div>
      </header>

      <!-- Main content -->
      <main class="flex-1 p-6 lg:p-10 space-y-8 s14-shell">

        <!-- Page title -->
        <div class="border-b border-white/10 pb-6 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
          <div>
            <h1 class="font-headline text-4xl lg:text-5xl font-black text-white leading-none tracking-tighter uppercase italic">
              Hours Report
            </h1>
            <p id="page-subtitle" class="text-on-surface-variant mt-3">Overview of trainer hours across sessions.</p>
          </div>
          <!-- Staff only: link back to assignment page -->
          <a id="staff-link" href="assign-trainer.html"
            class="self-start sm:self-auto flex items-center gap-2 px-5 h-10 border border-outline/60 text-on-surface-variant hover:text-white hover:border-white transition-colors text-xs font-bold uppercase tracking-widest">
            <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
            Trainer Assignment
          </a>
        </div>

        <!-- Alert -->
        <div id="page-alert" class="hidden px-4 py-3 text-sm font-medium border"></div>

        <!-- Filter bar -->
        <div class="flex flex-col sm:flex-row sm:items-center gap-4">
          <div class="flex items-center gap-0 border border-outline/40 self-start s14-pills">
            <button data-range="today"
              class="px-5 h-9 text-on-surface-variant text-xs font-bold uppercase tracking-widest hover:text-white transition-colors">Today</button>
            <button data-range="week"
              class="px-5 h-9 bg-primary text-on-primary text-xs font-bold uppercase tracking-widest transition-colors border-l border-r border-outline/40">This Week</button>
            <button data-range="month"
              class="px-5 h-9 text-on-surface-variant text-xs font-bold uppercase tracking-widest hover:text-white transition-colors">This Month</button>
          </div>
          <p id="date-range" class="text-on-surface-variant text-xs"></p>
        </div>

        <!-- Summary stats -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="bg-surface border border-outline/40 p-4 s14-card">
            <p class="text-on-surface-variant text-xs uppercase tracking-wider mb-1">Total Hours</p>
            <p id="stat-hours" class="font-headline font-black text-primary text-3xl">—</p>
          </div>
          <div class="bg-surface border border-outline/40 p-4 s14-card">
            <p class="text-on-surface-variant text-xs uppercase tracking-wider mb-1">Sessions</p>
            <p id="stat-sessions" class="font-headline font-black text-white text-3xl">—</p>
          </div>
          <div id="stat-trainers-card" class="bg-surface border border-outline/40 p-4 s14-card">
            <p class="text-on-surface-variant text-xs uppercase tracking-wider mb-1">Active Trainers</p>
            <p id="stat-trainers" class="font-headline font-black text-white text-3xl">—</p>
          </div>
          <div class="bg-surface border border-outline/40 p-4 s14-card">
            <p class="text-on-surface-variant text-xs uppercase tracking-wider mb-1">Pending Confirmation</p>
            <p id="stat-unconfirmed" class="font-headline font-black text-white text-3xl">—</p>
          </div>
        </div>

        <!-- Grouped totals (staff only) -->
        <div id="grouped-section" class="space-y-3">
          <h2 class="font-headline font-bold text-white text-sm uppercase tracking-widest">By Trainer</h2>
          <div id="grouped-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
        </div>

        <!-- Detail table -->
        <div>
          <h2 class="font-headline font-bold text-white text-sm uppercase tracking-widest mb-4">Session Breakdown</h2>
          <div class="bg-surface border border-outline/40 overflow-x-auto s14-card s14-table">
            <table class="w-full min-w-[600px]">
              <thead>
                <tr class="border-b border-white/10">
                  <th class="px-4 py-3 text-left text-[10px] text-on-surface-variant uppercase tracking-widest font-bold">Date</th>
                  <th class="px-4 py-3 text-left text-[10px] text-on-surface-variant uppercase tracking-widest font-bold">Trainer</th>
                  <th class="px-4 py-3 text-left text-[10px] text-on-surface-variant uppercase tracking-widest font-bold">Class</th>
                  <th class="px-4 py-3 text-left text-[10px] text-on-surface-variant uppercase tracking-widest font-bold">Hours</th>
                  <th class="px-4 py-3 text-left text-[10px] text-on-surface-variant uppercase tracking-widest font-bold">Status</th>
                </tr>
              </thead>
              <tbody id="report-tbody">
                <tr>
                  <td colspan="5" class="text-center py-12 text-on-surface-variant text-sm">Loading report...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script>
    const db = GymflowSupabase.createClient();

    const ui = {
      headerName: document.getElementById('header-name'),
      headerAvatarImg: document.getElementById('header-avatar-img'),
      headerAvatarInitial: document.getElementById('header-avatar-initial'),
      pageSubtitle: document.getElementById('page-subtitle'),
      groupedSection: document.getElementById('grouped-section'),
      groupedList: document.getElementById('grouped-list'),
      statTrainersCard: document.getElementById('stat-trainers-card'),
      staffLink: document.getElementById('staff-link'),
      dateRange: document.getElementById('date-range'),
      statHours: document.getElementById('stat-hours'),
      statSessions: document.getElementById('stat-sessions'),
      statTrainers: document.getElementById('stat-trainers'),
      statUnconfirmed: document.getElementById('stat-unconfirmed'),
      reportBody: document.getElementById('report-tbody'),
      alert: document.getElementById('page-alert'),
      logoutBtn: document.getElementById('logout-btn'),
      rangeButtons: Array.from(document.querySelectorAll('[data-range]')),
    };

    let currentUser = null;
    let currentRole = 'member';
    let trainerRecord = null;
    let isTrainer = false;
    let activeRange = 'week';

    const toIsoDate = date => date.toISOString().split('T')[0];
    const toHours = value => Number(value || 0);

    const getHomeRoute = GymflowRoles.getHomeRoute;
    const resolveUserRole = user => GymflowSupabase.resolveUserRole(db, user);

    async function init() {
      const session = await GymflowSupabase.getSession(db);
      if (!session) {
        window.location.replace('login.html');
        return;
      }

      currentUser = session.user;
      currentRole = await resolveUserRole(currentUser);
      if (currentRole === 'member') {
        window.location.replace('dashboard.html');
        return;
      }

      GymflowNav.renderRoleMenu({ navId: 'main-nav', role: currentRole, activeHref: 'trainer-report.html' });
      GymflowNav.initMenuNav();

      await loadHeader();
      const roleReady = await detectRole();
      if (!roleReady) return;
      bindRangeButtons();
      await refreshReport();
    }

    async function detectRole() {
      if (currentRole !== 'trainer') {
        isTrainer = false;
        trainerRecord = null;
        return true;
      }

      const { data: trainer } = await db
        .from('trainers')
        .select('id, name')
        .eq('user_id', currentUser.id)
        .maybeSingle();

      if (!trainer) {
        showAlert('We could not find your trainer profile. Contact an admin.', 'error');
        setTimeout(() => window.location.replace('dashboard.html'), 1400);
        return false;
      }

      isTrainer = true;
      trainerRecord = trainer;
      ui.pageSubtitle.textContent = 'Your logged hours for this period.';
      ui.groupedSection.classList.add('hidden');
      ui.statTrainersCard.classList.add('hidden');
      ui.staffLink.classList.add('hidden');
      return true;
    }

    async function loadHeader() {
      const { data: profile } = await db
        .from('profiles')
        .select('name, avatar_url')
        .eq('user_id', currentUser.id)
        .maybeSingle();

      GymflowNav.applyProfileMini({
        nameId: 'header-name',
        subtitleId: 'header-role-label',
        avatarImgId: 'header-avatar-img',
        avatarInitialId: 'header-avatar-initial',
        name: profile?.name || currentUser.email || 'Member',
        subtitle: GymflowNav.getRoleLabel(currentRole),
        avatarUrl: profile?.avatar_url,
      });
    }

    function getDateRange(rangeKey) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      if (rangeKey === 'today') {
        const date = toIsoDate(today);
        return { start: date, end: date };
      }

      if (rangeKey === 'week') {
        const dayOfWeek = today.getDay();
        const monday = new Date(today);
        monday.setDate(today.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);

        return { start: toIsoDate(monday), end: toIsoDate(sunday) };
      }

      const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
      const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
      return { start: toIsoDate(firstDay), end: toIsoDate(lastDay) };
    }

    function formatDate(dateStr) {
      return new Date(`${dateStr}T00:00:00`).toLocaleDateString('en-GB', {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
      });
    }

    function setActiveRangeButton(activeButton) {
      ui.rangeButtons.forEach(button => {
        button.classList.toggle('bg-primary', button === activeButton);
        button.classList.toggle('text-on-primary', button === activeButton);
        button.classList.toggle('text-on-surface-variant', button !== activeButton);
      });
    }

    function bindRangeButtons() {
      ui.rangeButtons.forEach(button => {
        button.addEventListener('click', () => {
          activeRange = button.dataset.range;
          setActiveRangeButton(button);
          refreshReport();
        });
      });
    }

    function renderLoadingState() {
      ui.reportBody.innerHTML =
        '<tr><td colspan="5" class="text-center py-12 text-on-surface-variant text-sm">Loading report...</td></tr>';
    }

    function renderEmptyState(message) {
      ui.reportBody.innerHTML = `<tr>
        <td colspan="5" class="text-center py-16 text-on-surface-variant">
          <span class="material-symbols-outlined text-4xl block mb-2 opacity-30">schedule</span>
          ${message}
        </td>
      </tr>`;
    }

    function asKey(value) {
      return String(value);
    }

    async function refreshReport() {
      const { start, end } = getDateRange(activeRange);
      ui.dateRange.textContent = `${formatDate(start)} – ${formatDate(end)}`;
      renderLoadingState();

      let query = db
        .from('trainer_hours')
        .select('id, trainer_id, class_id, date, hours_logged, confirmed')
        .gte('date', start)
        .lte('date', end)
        .order('date', { ascending: false });

      if (isTrainer && trainerRecord) {
        query = query.eq('trainer_id', trainerRecord.id);
      }

      const { data: rawRows, error: hoursError } = await query;
      if (hoursError) {
        showAlert(`Could not load report: ${hoursError.message}`, 'error');
        renderEmptyState('Error loading data.');
        return;
      }

      const trainerIds = [...new Set((rawRows || []).map(row => row.trainer_id).filter(Boolean))];
      const classIds = [...new Set((rawRows || []).map(row => row.class_id).filter(Boolean))];

      let trainersById = new Map();
      if (trainerIds.length) {
        const { data: trainers, error: trainerError } = await db
          .from('trainers')
          .select('id, name, specialisation')
          .in('id', trainerIds);
        if (trainerError) {
          showAlert(`Could not load trainers: ${trainerError.message}`, 'error');
        } else {
          trainersById = new Map((trainers || []).map(row => [asKey(row.id), row]));
        }
      }

      let classesById = new Map();
      if (classIds.length) {
        const { data: classes, error: classError } = await db
          .from('gym_classes')
          .select('id, name')
          .in('id', classIds);
        if (classError) {
          showAlert(`Could not load class names: ${classError.message}`, 'error');
        } else {
          classesById = new Map((classes || []).map(row => [asKey(row.id), row]));
        }
      }

      const rows = (rawRows || []).map(row => ({
        ...row,
        trainer: trainersById.get(asKey(row.trainer_id)) || null,
        classInfo: classesById.get(asKey(row.class_id)) || null,
      }));

      updateStats(rows);

      if (!isTrainer) {
        renderTrainerTotals(rows);
      }

      renderTable(rows);
    }

    function updateStats(rows) {
      const totalHours = rows.reduce((sum, row) => sum + toHours(row.hours_logged), 0);
      const unconfirmedCount = rows.filter(row => !row.confirmed).length;
      const trainerIds = rows.map(row => row.trainer?.id).filter(Boolean);

      ui.statHours.textContent = totalHours.toFixed(1);
      ui.statSessions.textContent = rows.length;
      ui.statTrainers.textContent = new Set(trainerIds).size;
      ui.statUnconfirmed.textContent = unconfirmedCount;
    }

    function renderTrainerTotals(rows) {
      ui.groupedList.innerHTML = '';

      const totalsByTrainer = {};
      for (const row of rows) {
        const trainer = row.trainer;
        if (!trainer?.id) continue;

        if (!totalsByTrainer[trainer.id]) {
          totalsByTrainer[trainer.id] = {
            name: trainer.name,
            specialisation: trainer.specialisation,
            hours: 0,
            sessions: 0,
          };
        }

        totalsByTrainer[trainer.id].hours += toHours(row.hours_logged);
        totalsByTrainer[trainer.id].sessions += 1;
      }

      const trainers = Object.values(totalsByTrainer).sort((a, b) => b.hours - a.hours);

      if (!trainers.length) {
        ui.groupedList.innerHTML = '<p class="text-on-surface-variant text-sm col-span-full">No trainer activity for this period.</p>';
        return;
      }

      trainers.forEach(trainer => {
        const card = document.createElement('div');
        card.className = 'bg-surface border border-outline/40 p-4 flex items-center gap-4 s14-card';
        card.innerHTML = `
          <div class="size-10 rounded-full bg-primary flex items-center justify-center flex-shrink-0">
            <span class="font-headline font-black text-on-primary">${trainer.name.charAt(0).toUpperCase()}</span>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-headline font-bold text-white text-sm truncate">${trainer.name}</p>
            ${trainer.specialisation ? `<p class="text-[10px] text-on-surface-variant">${trainer.specialisation}</p>` : ''}
            <p class="text-[10px] text-on-surface-variant mt-0.5">${trainer.sessions} session${trainer.sessions !== 1 ? 's' : ''}</p>
          </div>
          <div class="text-right flex-shrink-0">
            <p class="font-headline font-black text-primary text-xl">${trainer.hours.toFixed(1)}</p>
            <p class="text-[10px] text-on-surface-variant uppercase tracking-wider">hrs</p>
          </div>`;
        ui.groupedList.appendChild(card);
      });
    }

    function renderTable(rows) {
      ui.reportBody.innerHTML = '';

      if (!rows.length) {
        renderEmptyState('No logged hours for this period.');
        return;
      }

      rows.forEach(row => {
        const trainer = row.trainer;
        const className = row.classInfo?.name || (row.class_id ? `Class #${row.class_id}` : '—');
        const tr = document.createElement('tr');
        tr.className = 'border-b border-white/5 hover:bg-surface-variant/30 transition-colors';
        tr.innerHTML = `
          <td class="px-4 py-3 text-sm text-on-surface-variant whitespace-nowrap">${formatDate(row.date)}</td>
          <td class="px-4 py-3">
            <p class="text-sm font-semibold text-white">${trainer?.name || '—'}</p>
            ${trainer?.specialisation ? `<p class="text-[10px] text-on-surface-variant">${trainer.specialisation}</p>` : ''}
          </td>
          <td class="px-4 py-3 text-sm text-on-surface-variant">${className}</td>
          <td class="px-4 py-3 whitespace-nowrap">
            <span class="font-headline font-bold text-primary">${toHours(row.hours_logged).toFixed(2)}</span>
            <span class="text-on-surface-variant text-xs"> hrs</span>
          </td>
          <td class="px-4 py-3">
            ${row.confirmed
              ? '<span class="px-2 py-0.5 bg-primary/10 text-primary text-[10px] font-bold uppercase tracking-wider">Confirmed</span>'
              : `<span class="px-2 py-0.5 bg-white/10 text-on-surface-variant text-[10px] font-bold uppercase tracking-wider">Pending</span>
                 ${!isTrainer ? `<button onclick="confirmHours('${row.id}')"
                   class="ml-2 px-2 py-0.5 border border-primary/40 text-primary hover:bg-primary hover:text-on-primary text-[10px] font-bold uppercase tracking-wider transition-colors">
                   Confirm
                 </button>` : ''}`}
          </td>`;
        ui.reportBody.appendChild(tr);
      });
    }

    async function confirmHours(rowId) {
      const { error } = await db.from('trainer_hours').update({ confirmed: true }).eq('id', rowId);
      if (error) {
        showAlert(`Could not confirm hours: ${error.message}`, 'error');
        return;
      }

      await refreshReport();
      showAlert('Hours confirmed.', 'success');
    }

    function showAlert(message, type) {
      ui.alert.textContent = message;
      ui.alert.className = type === 'success'
        ? 'px-4 py-3 text-sm font-medium border border-primary/30 bg-primary/10 text-primary'
        : 'px-4 py-3 text-sm font-medium border border-red-500/30 bg-red-500/10 text-red-400';
      ui.alert.classList.remove('hidden');
      setTimeout(() => ui.alert.classList.add('hidden'), 4000);
    }

    async function handleLogout() {
      await db.auth.signOut();
      window.location.replace('login.html');
    }

    ui.logoutBtn.addEventListener('click', handleLogout);
    window.confirmHours = confirmHours;
    init();
  </script>
</body>
</html>
