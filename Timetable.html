<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>GymFlow | Class Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared-supabase.js"></script>
  <script src="auth-role.js"></script>
  <script src="shared-nav.js"></script>
  <link href="shared-nav.css" rel="stylesheet">
  <script src="shared-theme.js"></script>
  <script id="tailwind-config">
    applyGymflowTailwindConfig();
  </script>
  <link href="shared-theme.css" rel="stylesheet">
</head>

<body class="timetable-page bg-background text-on-surface font-body antialiased">
    <div id="participant-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-background/90 backdrop-blur-sm">
    <div class="bg-surface border border-white/10 w-full max-w-md p-8 relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-on-surface-variant hover:text-white transition-colors">
        <span class="material-symbols-outlined">close</span>
      </button>
      <div class="mb-8">
        <p class="text-primary font-black uppercase text-[10px] tracking-[0.4em] mb-2">Class Roster</p>
        <h2 id="modal-class-name" class="font-headline text-3xl font-black text-white uppercase italic leading-none">Class Name</h2>
      </div>
      <div id="participants-list" class="space-y-2 max-h-[400px] overflow-y-auto pr-2">
        </div>
      <button onclick="closeModal()" class="w-full mt-8 bg-white text-black py-4 font-headline font-black uppercase text-xs tracking-widest hover:bg-primary transition-all">
        Close Roster
      </button>
    </div>
  </div>
  <div class="min-h-screen flex flex-col">
    <header class="site-nav sticky top-0 z-50 relative">
      <div class="flex items-center justify-between gap-4 px-6 lg:px-10 py-3">
        <a href="index.html" class="flex items-center gap-4 text-primary hover:opacity-90 transition-opacity">
          <div class="size-6">
            <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
              <path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="currentColor" fill-rule="evenodd"></path>
            </svg>
          </div>
          <h2 class="text-white font-headline text-xl font-black leading-tight tracking-[-0.03em]">GYMFLOW</h2>
        </a>

        <div class="flex items-center gap-3">
          <button id="menu-toggle" aria-expanded="false" aria-controls="menu-panel" class="menu-toggle">
            <span id="menu-icon" class="material-symbols-outlined" style="font-size: 18px;">menu</span>
            <span>Menu</span>
          </button>

        <div class="hidden sm:flex items-center gap-3 pr-4 border-r border-white/10">
          <div class="text-right">
            <p id="nav-user-name" class="font-headline font-bold text-white text-xs">...</p>
            <p id="nav-user-plan" class="text-[8px] text-primary uppercase tracking-[0.1em] font-bold">Member</p>
          </div>
          <div class="size-8 rounded-full border border-primary overflow-hidden flex items-center justify-center bg-surface-variant">
            <img id="nav-user-avatar" alt="Profile" class="w-full h-full object-cover hidden" src="" />
            <span id="nav-avatar-initial" class="text-primary font-bold text-xs">?</span>
          </div>
        </div>

        <button id="logout-btn" class="flex items-center gap-2 text-on-surface-variant hover:text-red-500 transition-colors">
          <span class="material-symbols-outlined" style="font-size: 20px;">logout</span>
          <span class="hidden md:block text-[10px] font-bold uppercase tracking-widest">Sign Out</span>
        </button>
      </div>
      </div>

      <div id="menu-panel" class="hidden absolute right-6 top-full z-50 mt-2 w-[30%] min-w-[260px] max-w-[520px] border border-white/10 bg-background/95 p-3 shadow-[0_20px_45px_rgba(0,0,0,0.45)]">
        <nav id="main-nav" class="grid grid-cols-1 gap-3"></nav>
      </div>
    </header>

    <main class="flex-1 p-6 lg:p-10 max-w-7xl mx-auto w-full">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 gap-6">
        <div class="space-y-4">
          <h1 class="font-headline text-5xl lg:text-8xl font-black text-white uppercase italic leading-none tracking-tighter">
            Class <span class="text-primary" id="hero-span">Schedule</span>
          </h1>
          <div id="trainer-actions" class="hidden flex flex-wrap gap-3">
            <a href="StaffClass.html" class="inline-flex items-center gap-3 bg-primary text-on-primary px-6 py-3 font-headline font-black uppercase text-xs tracking-[0.2em] hover:scale-105 active:scale-95 transition-all">
              <span class="material-symbols-outlined" style="font-variation-settings: 'wght' 700;">add</span>Add New Class
            </a>
            <a href="StaffEdit.html" class="inline-flex items-center gap-3 border border-primary/40 text-primary px-6 py-3 font-headline font-black uppercase text-xs tracking-[0.2em] hover:bg-primary hover:text-on-primary transition-all">
              <span class="material-symbols-outlined" style="font-variation-settings: 'wght' 700;">edit</span>Edit Classes
            </a>
          </div>
        </div>
        <div class="flex flex-col items-start md:items-end">
          <p class="text-primary font-black uppercase text-[10px] tracking-[0.4em]">Live Database Connection</p>
          <p id="current-week" class="text-on-surface-variant font-bold uppercase text-[10px] tracking-[0.2em] mt-1"></p>
        </div>
      </div>

      <div id="timetable-container" class="space-y-1 border-t border-white/10">
        <div id="loading-state" class="py-24 text-center">
          <div class="inline-block animate-spin size-10 border-[3px] border-primary border-t-transparent mb-6"></div>
          <p class="text-white uppercase text-[10px] font-black tracking-[0.4em] animate-pulse">Syncing Weekly Schedule...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const db = GymflowSupabase.createClient();

    const today = new Date();
    document.getElementById('current-week').innerText = `Week of ${today.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;

    let currentUser = null;
    let currentRole = 'member';
    const resolveUserRole = user => GymflowSupabase.resolveUserRole(db, user);

    async function init() {
      const session = await GymflowSupabase.getSession(db);

      currentUser = session?.user || null;
      currentRole = currentUser ? await resolveUserRole(currentUser) : 'member';

      GymflowNav.renderRoleMenu({ navId: 'main-nav', role: currentRole, activeHref: 'Timetable.html' });
      GymflowNav.initMenuNav();

      await loadProfile();
      await fetchAndRenderTimetable();
    }

    async function loadProfile() {
      if (!currentUser) {
        document.getElementById('nav-user-name').innerText = 'Guest';
        document.getElementById('nav-user-plan').innerText = 'Public View';
        document.getElementById('nav-avatar-initial').innerText = 'G';
        const logoutLabel = document.querySelector('#logout-btn .hidden.md\\:block');
        if (logoutLabel) logoutLabel.innerText = 'Sign In';
        return;
      }

      const { data: profile, error } = await db.from('profiles').select('*').eq('user_id', currentUser.id).single();
      if (error) console.error("Profile Load Error:", error);

      if (profile) {
        document.getElementById('nav-user-name').innerText = profile.name || 'Member';
        document.getElementById('nav-user-plan').innerText = profile.plan_name || 'GUEST PASS';
        document.getElementById('nav-avatar-initial').innerText = (profile.name || 'M').charAt(0).toUpperCase();

        if (profile.avatar_url) {
          const img = document.getElementById('nav-user-avatar');
          img.src = profile.avatar_url;
          img.classList.remove('hidden');
          document.getElementById('nav-avatar-initial').classList.add('hidden');
        }

        if (currentRole !== 'member') {
          GymflowTheme.applyStaffAccent();
          document.getElementById('nav-user-plan').innerText = 'STAFF';

          if (currentRole === 'admin') {
            document.getElementById('trainer-actions').classList.remove('hidden');
          }
        }
      }
    }

    async function fetchAndRenderTimetable() {
      const container = document.getElementById('timetable-container');

      // 1. Fetch classes and current user's bookings
      const { data: classes, error } = await db.from('gym_classes').select('*').order('date', { ascending: true });
      let bookedIds = [];

      if (currentUser) {
        const { data: myBookings } = await db
          .from('class_bookings')
          .select('class_id')
          .eq('user_id', currentUser.id);

        bookedIds = myBookings ? myBookings.map(b => b.class_id) : [];
      }

      if (error) {
        container.innerHTML = `<div class="py-20 text-center"><p class="text-red-500 font-bold">Error: ${error.message}</p></div>`;
        return;
      }

      if (!classes || classes.length === 0) {
        container.innerHTML = `<div class="py-20 text-center"><p class="text-on-surface-variant uppercase text-xs tracking-widest font-bold">No classes scheduled.</p></div>`;
        return;
      }

      const isPrivileged = currentRole === 'trainer' || currentRole === 'admin';

      container.innerHTML = '';
      classes.forEach(cls => {
        const [year, month, day] = cls.date.split('-');
        const dateObj = new Date(year, month - 1, day);
        const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
        const dayNum = dateObj.getDate();
        
        const isFull = (cls.capacity || 0) <= 0;
        const isBooked = bookedIds.includes(cls.id);

        // --- DYNAMIC BUTTON LOGIC ---
        let buttonHTML = '';
        if (isPrivileged) {
          // Show Trainer Button
          buttonHTML = `<button onclick="viewParticipants('${cls.id}', '${cls.name}')" class="px-6 py-4 border border-primary text-primary font-headline font-black uppercase text-[10px] tracking-widest hover:bg-primary hover:text-on-primary transition-all">View Roster</button>`;
        } else {
          // Show Member Buttons
          if (!currentUser) {
             buttonHTML = `<button onclick="window.location.href='login.html'" class="px-6 py-4 border border-primary/40 text-primary font-headline font-black uppercase text-[10px] tracking-widest hover:bg-primary hover:text-on-primary transition-all">Sign In to Book</button>`;
          } else if (isBooked) {
             buttonHTML = `<button onclick="cancelBooking('${cls.id}', ${cls.capacity})" class="px-10 py-4 font-headline font-black uppercase text-xs tracking-widest transition-all bg-red-600/20 text-red-500 border border-red-500/50 hover:bg-red-600 hover:text-white">Remove Booking</button>`;
          } else if (isFull) {
             buttonHTML = `<button disabled class="px-10 py-4 font-headline font-black uppercase text-xs tracking-widest transition-all bg-zinc-800 text-zinc-500 cursor-not-allowed">Class Full</button>`;
          } else {
             buttonHTML = `<button onclick="bookClass('${cls.id}', ${cls.capacity})" class="book-btn bg-white text-black hover:bg-primary px-10 py-4 font-headline font-black uppercase text-xs tracking-widest transition-all">Book Spot</button>`;
          }
        }

        container.insertAdjacentHTML('beforeend', `
          <div class="timetable-grid border-b border-white/10 group hover:bg-surface-variant/30 transition-all duration-300">
            <div class="py-8 flex flex-col items-center justify-center border-r border-white/10 bg-surface/10 group-hover:bg-primary transition-all duration-300">
              <span class="text-[10px] font-black text-on-surface-variant group-hover:text-on-primary tracking-tighter">${dayName}</span>
              <span class="text-3xl font-headline font-black text-white group-hover:text-on-primary">${dayNum}</span>
            </div>
            <div class="p-6 md:px-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
              <div class="space-y-2">
                <div class="flex items-center gap-4 mb-1">
                  <span class="text-[10px] font-black text-primary bg-primary/10 border border-primary/20 px-3 py-1 uppercase tracking-widest">${cls.time ? cls.time.slice(0,5) : '--:--'}</span>
                  <span class="text-[10px] font-bold text-on-surface-variant uppercase tracking-[0.2em] italic">${cls.location || 'Main Gym'}</span>
                </div>
                <h3 class="font-headline text-2xl md:text-3xl font-black text-white uppercase italic">${cls.name}</h3>
                <div class="flex gap-4">
                  <p class="text-[10px] text-on-surface-variant font-bold uppercase tracking-widest">Spots: <span class="text-white">${cls.capacity || '0'}</span></p>
                  <p class="text-[10px] text-on-surface-variant font-bold uppercase tracking-widest">Coach: <span class="text-primary">${cls.coach || 'Lead Staff'}</span></p>
                </div>
              </div>
              <div class="flex gap-3">
                ${buttonHTML}
              </div>
            </div>
          </div>`);
      });
    }

    async function bookClass(classId, capacity) {
      if (!currentUser) {
        window.location.href = 'login.html';
        return;
      }

      if (capacity <= 0) return;
      // Fetch the user's name directly from the navigation bar so we don't have to change your variables!
      const userName = document.getElementById('nav-user-name').innerText; 

      const { error: bookingError } = await db.from('class_bookings').insert({
        class_id: classId,
        user_id: currentUser.id,
        user_name: userName || 'Member'
      });
      if (bookingError) return alert('Booking failed: ' + bookingError.message);
      
      await db.from('gym_classes').update({ capacity: capacity - 1 }).eq('id', classId);
      fetchAndRenderTimetable();
    }

    async function cancelBooking(classId, capacity) {
      if (!currentUser) {
        window.location.href = 'login.html';
        return;
      }

      await db.from('class_bookings').delete().match({ class_id: classId, user_id: currentUser.id });
      await db.from('gym_classes').update({ capacity: capacity + 1 }).eq('id', classId);
      fetchAndRenderTimetable();
    }

    async function viewParticipants(classId, className) {
      const modal = document.getElementById('participant-modal');
      const listContainer = document.getElementById('participants-list');
      const title = document.getElementById('modal-class-name');
      
      title.innerText = className;
      listContainer.innerHTML = '<div class="py-4 text-zinc-500 animate-pulse text-[10px] font-black uppercase tracking-[0.2em]">Loading Roster...</div>';
      modal.classList.remove('hidden');

      const { data, error } = await db.from('class_bookings').select('user_name').eq('class_id', classId);
      
      if (error || !data || data.length === 0) {
        listContainer.innerHTML = '<div class="py-10 text-zinc-500 border border-white/5 bg-white/5 flex flex-col items-center"><span class="material-symbols-outlined mb-2 opacity-20">group_off</span><p class="text-[10px] font-black uppercase tracking-widest">No Participants Yet</p></div>';
        return;
      }

      listContainer.innerHTML = data.map(p => `
        <div class="flex items-center gap-4 bg-white/5 border border-white/10 p-4 group hover:bg-primary/10 transition-colors">
          <div class="size-2 bg-primary group-hover:scale-125 transition-transform"></div>
          <span class="text-xs font-headline font-bold text-white uppercase tracking-wider">${p.user_name}</span>
        </div>
      `).join('');
    }

    function closeModal() {
      document.getElementById('participant-modal').classList.add('hidden');
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      if (!currentUser) {
        window.location.href = 'login.html';
        return;
      }

      await db.auth.signOut();
      window.location.href = 'login.html';
    });

    init();
  </script>
</body>
</html>
