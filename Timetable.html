<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>GymFlow | Class Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#D7FF00",
            "on-primary": "#0e0e0e",
            "background": "#0e0e0e",
            "surface": "#131313",
            "surface-variant": "#1a1a1a",
            "outline": "#404040",
            "on-surface": "#ffffff",
            "on-surface-variant": "#a3a3a3",
          },
          fontFamily: {
            "headline": ["Lexend"],
            "body": ["Inter"],
            "label": ["Inter"]
          },
          borderRadius: {
            "DEFAULT": "0px",
            "lg": "0px",
            "xl": "0px",
            "full": "9999px"
          },
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .glass-nav {
      background: rgba(14, 14, 14, 0.8);
      backdrop-filter: blur(12px);
    }

    .timetable-grid {
      display: grid;
      grid-template-columns: 80px 1fr;
    }

    .book-btn {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .book-btn:not(:disabled):hover {
      letter-spacing: 0.2em;
      transform: scale(1.05);
    }
  </style>
</head>

<body class="bg-background text-on-surface font-body antialiased">
  <div class="min-h-screen flex flex-col">
    <!-- SYNCED NAVBAR START -->
    <header class="flex items-center justify-between whitespace-nowrap border-b border-white/10 px-6 lg:px-10 py-4 glass-nav sticky top-0 z-50">
      <div class="flex items-center gap-12">
        <div class="flex items-center gap-4 text-primary">
          <div class="size-6">
            <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
              <path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="currentColor" fill-rule="evenodd"></path>
            </svg>
          </div>
          <h2 class="text-white font-headline text-xl font-black leading-tight tracking-[-0.03em]">GYMFLOW</h2>
        </div>

        <nav class="hidden md:flex items-center h-10">
          <a class="flex items-center gap-2 px-6 h-full text-on-surface-variant hover:text-white hover:bg-surface-variant transition-all" href="dashboard.html">
            <span class="material-symbols-outlined" style="font-size: 20px;">dashboard</span>
            <span class="text-xs uppercase tracking-widest font-bold">Dashboard</span>
          </a>
          <a class="flex items-center gap-2 px-6 h-full text-on-surface-variant hover:text-white hover:bg-surface-variant transition-all" href="membership.html">
            <span class="material-symbols-outlined" style="font-size: 20px;">card_membership</span>
            <span class="text-xs uppercase tracking-widest font-bold">Memberships</span>
          </a>
          <a class="flex items-center gap-2 px-6 h-full bg-primary text-on-primary font-bold transition-all" href="timetable.html">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 20px;">calendar_today</span>
            <span class="text-xs uppercase tracking-widest font-bold">Timetable</span>
          </a>
        </nav>
      </div>

      <div class="flex items-center gap-6">
        <div class="hidden sm:flex items-center gap-3 pr-4 border-r border-white/10">
          <div class="text-right">
            <p id="nav-user-name" class="font-headline font-bold text-white text-xs">...</p>
            <p id="nav-user-plan" class="text-[8px] text-primary uppercase tracking-[0.1em] font-bold">...</p>
          </div>
          <div class="size-8 rounded-full border border-primary overflow-hidden">
            <img id="nav-user-avatar" alt="Profile" class="w-full h-full object-cover" src="https://ui-avatars.com/api/?background=D7FF00&color=0e0e0e" />
          </div>
        </div>
        <div class="flex gap-4">
          <button class="flex items-center justify-center h-10 w-10 bg-surface-variant hover:bg-white hover:text-black transition-colors">
            <span class="material-symbols-outlined" style="font-size: 20px;">notifications</span>
          </button>
          <button class="flex items-center justify-center h-10 w-10 bg-surface-variant hover:bg-white hover:text-black transition-colors">
            <span class="material-symbols-outlined" style="font-size: 20px;">account_circle</span>
          </button>
        </div>
      </div>
    </header>
    <!-- SYNCED NAVBAR END -->

    <main class="flex-1 p-6 lg:p-10 max-w-7xl mx-auto w-full">
      <div class="flex flex-col md:flex-row justify-between items-baseline mb-12 gap-4">
        <h1 class="font-headline text-5xl lg:text-8xl font-black text-white uppercase italic leading-none tracking-tighter">
          Class <span class="text-primary">Schedule</span>
        </h1>
        <div class="flex flex-col items-end">
          <p class="text-primary font-black uppercase text-[10px] tracking-[0.4em]">Live Database Connection</p>
          <p id="current-week" class="text-on-surface-variant font-bold uppercase text-[10px] tracking-[0.2em] mt-1"></p>
        </div>
      </div>

      <div id="timetable-container" class="space-y-1 border-t border-white/10">
        <div id="loading-state" class="py-24 text-center">
          <div class="inline-block animate-spin size-10 border-[3px] border-primary border-t-transparent mb-6"></div>
          <p class="text-white uppercase text-[10px] font-black tracking-[0.4em] animate-pulse">Syncing Weekly Schedule...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://pawooalkgiveltrbylqe.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhd29vYWxrZ2l2ZWx0cmJ5bHFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNDQxNDUsImV4cCI6MjA4OTYyMDE0NX0.Jd5aCIt6BOaYolHrmtZ77V1Jxsh5oHomR9FCICpbdFk';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const today = new Date();
    document.getElementById('current-week').innerText = `Week of ${today.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;

    // NAVBAR DATA FETCH
    async function loadUserData() {
      const testUserId = "00000000-0000-0000-0000-000000000000";
      const { data: userData } = await _supabase
        .from("user_subscriptions")
        .select("first_name, last_name, plan_name, avatar_url")
        .eq("user_id", testUserId)
        .single();

      if (userData) {
        document.getElementById('nav-user-name').innerText = `${userData.first_name} ${userData.last_name}`;
        document.getElementById('nav-user-plan').innerText = userData.plan_name;
        document.getElementById('nav-user-avatar').src = userData.avatar_url;
      }
    }

    async function toggleSpot(classId, currentCapacity, isJoining) {
      const newCapacity = isJoining ? currentCapacity - 1 : currentCapacity + 1;

      if (isJoining && currentCapacity <= 0) {
        alert("This class is already full!");
        return;
      }

      const { error } = await _supabase
        .from('gym_classes')
        .update({ capacity: newCapacity })
        .eq('id', classId);

      if (error) {
        console.error("Supabase Error:", error);
        alert("Action failed. Check RLS policies.");
      } else {
        if (isJoining) {
          localStorage.setItem(`booked_${classId}`, 'true');
        } else {
          localStorage.removeItem(`booked_${classId}`);
        }
        fetchAndRenderTimetable();
      }
    }

    async function fetchAndRenderTimetable() {
      const container = document.getElementById('timetable-container');

      const { data: classes, error } = await _supabase
        .from('gym_classes')
        .select('*')
        .order('date', { ascending: true })
        .order('time', { ascending: true });

      if (error) {
        console.error("Supabase Error:", error);
        container.innerHTML = `<p class="text-red-500 py-10 text-center font-bold uppercase text-xs tracking-widest">Error connecting to database: ${error.message}</p>`;
        return;
      }

      if (!classes || classes.length === 0) {
        container.innerHTML = `<p class="text-on-surface-variant py-24 text-center uppercase font-black tracking-[0.3em] text-xs">No sessions scheduled for this period.</p>`;
        return;
      }

      container.innerHTML = '';

      classes.forEach(cls => {
        const [year, month, day] = cls.date.split('-');
        const dateObj = new Date(year, month - 1, day);
        const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
        const dayNum = dateObj.getDate();

        const hasBooked = localStorage.getItem(`booked_${cls.id}`) === 'true';
        const isFull = cls.capacity <= 0;

        let buttonHtml = '';
        if (hasBooked) {
          buttonHtml = `<button onclick="toggleSpot('${cls.id}', ${cls.capacity}, false)" class="book-btn bg-red-600 text-white px-10 py-4 font-headline font-black uppercase text-xs tracking-widest hover:bg-red-700 transition-all">Cancel Spot</button>`;
        } else if (isFull) {
          buttonHtml = `<button disabled class="bg-zinc-800 text-zinc-500 px-10 py-4 font-headline font-black uppercase text-xs tracking-widest cursor-not-allowed">Class Full</button>`;
        } else {
          buttonHtml = `<button onclick="toggleSpot('${cls.id}', ${cls.capacity}, true)" class="book-btn bg-white text-black px-10 py-4 font-headline font-black uppercase text-xs tracking-widest hover:bg-primary transition-all">Book Spot</button>`;
        }

        const classRow = `
          <div class="timetable-grid border-b border-white/10 group hover:bg-surface-variant/30 transition-all duration-300">
              <div class="py-8 flex flex-col items-center justify-center border-r border-white/10 bg-surface/10 group-hover:bg-primary transition-all duration-300">
                  <span class="text-[10px] font-black text-on-surface-variant group-hover:text-on-primary tracking-tighter transition-colors">${dayName}</span>
                  <span class="text-3xl font-headline font-black text-white group-hover:text-on-primary transition-colors">${dayNum}</span>
              </div>
              <div class="p-6 md:px-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
                  <div class="space-y-2">
                      <div class="flex items-center gap-4 mb-1">
                          <span class="text-[10px] font-black text-primary bg-primary/10 border border-primary/20 px-3 py-1 uppercase tracking-widest group-hover:bg-primary group-hover:text-on-primary transition-all">${cls.time.slice(0,5)}</span>
                          <span class="text-[10px] font-bold text-on-surface-variant uppercase tracking-[0.2em] italic">${cls.location}</span>
                      </div>
                      <h3 class="font-headline text-2xl md:text-3xl font-black text-white uppercase italic group-hover:translate-x-2 transition-transform duration-300">${cls.name}</h3>
                      <div class="flex gap-4">
                          <p class="text-[10px] text-on-surface-variant font-bold uppercase tracking-widest">Available: <span class="${isFull && !hasBooked ? 'text-red-500' : 'text-white'}">${cls.capacity}</span></p>
                          <p class="text-[10px] text-on-surface-variant font-bold uppercase tracking-widest">Coach: <span class="text-white">Lead Staff</span></p>
                      </div>
                  </div>
                  ${buttonHtml}
              </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', classRow);
      });
    }

    // Initial load
    loadUserData();
    fetchAndRenderTimetable();
  </script>
</body>

</html>
