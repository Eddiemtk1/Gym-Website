<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Staff – Trainer Assignment</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00E0FF", // Trainer Cyan
            "on-primary": "#0e0e0e",
            "background": "#0e0e0e",
            "surface": "#131313",
            "surface-variant": "#1a1a1a",
            "outline": "#404040",
            "on-surface": "#ffffff",
            "on-surface-variant": "#a3a3a3",
          },
          fontFamily: { "headline": ["Lexend"], "body": ["Inter"], "label": ["Inter"] },
          borderRadius: { "DEFAULT": "0px", "lg": "0px", "xl": "0px", "full": "9999px" },
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .glass-nav { background: rgba(14, 14, 14, 0.8); backdrop-filter: blur(12px); }
    .hidden-load { visibility: hidden; }
    @media (min-width: 768px) { .md-flex { display: flex !important; } }
  </style>
</head>

<body class="bg-background text-on-surface font-body antialiased hidden-load" id="main-body">
  <div class="relative flex min-h-screen w-full flex-col bg-background overflow-x-hidden">
    <div class="flex h-full grow flex-col">

      <header class="flex items-center justify-between whitespace-nowrap border-b border-white/10 px-6 lg:px-10 py-4 glass-nav sticky top-0 z-50">
        <div class="flex items-center gap-12">
          <div class="flex items-center gap-4 text-primary">
            <div class="size-6">
              <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="currentColor" fill-rule="evenodd"></path>
              </svg>
            </div>
            <h2 class="text-white font-headline text-xl font-black leading-tight tracking-[-0.03em]">GYMFLOW</h2>
          </div>
          
          <!-- DYNAMIC NAV BAR -->
          <nav id="main-nav" class="hidden md-flex items-center h-10"></nav>
        </div>
        
        <div class="flex items-center gap-6">
          <div class="hidden sm:flex items-center gap-3 pr-4 border-r border-white/10">
            <div class="text-right">
              <p id="header-name" class="font-headline font-bold text-white text-xs">Loading...</p>
              <p id="role-badge" class="text-[8px] text-primary uppercase tracking-[0.1em] font-bold">Staff / Trainer</p>
            </div>
            <div class="size-8 rounded-full border border-primary overflow-hidden bg-surface-variant flex items-center justify-center">
              <span id="header-avatar-initial" class="font-headline text-sm font-bold text-primary">?</span>
            </div>
          </div>
          <button id="logout-btn" class="flex items-center gap-2 px-4 h-10 bg-surface-variant text-on-surface-variant hover:bg-white hover:text-black transition-colors text-xs font-bold uppercase tracking-widest">
            <span class="material-symbols-outlined" style="font-size: 18px;">logout</span>
          </button>
        </div>
      </header>

      <main class="flex-1 p-6 lg:p-10 space-y-8">
        <div class="border-b border-white/10 pb-6 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
          <div>
            <h1 class="font-headline text-4xl lg:text-5xl font-black text-white leading-none tracking-tighter uppercase italic">
              Trainer Assignment
            </h1>
            <p class="text-on-surface-variant mt-3">Staff Management Portal: Assign trainers to classes.</p>
          </div>
          <a href="trainer-report.html" class="self-start sm:self-auto flex items-center gap-2 px-5 h-10 border border-primary/40 text-primary hover:bg-primary hover:text-on-primary transition-colors text-xs font-bold uppercase tracking-widest">
            <span class="material-symbols-outlined" style="font-size: 18px;">summarize</span>
            View Hours Report
          </a>
        </div>

        <div id="page-alert" class="hidden px-4 py-3 text-sm font-medium border"></div>

        <div class="bg-surface border border-outline/40 overflow-x-auto">
          <table class="w-full min-w-[700px]">
            <thead>
              <tr class="border-b border-white/10">
                <th class="px-4 py-3 text-left text-[10px] text-on-surface-variant uppercase tracking-widest font-bold">Class</th>
                <th class="px-4 py-3 text-left text-[10px] text-on-surface-variant uppercase tracking-widest font-bold">Date & Time</th>
                <th class="px-4 py-3 text-left text-[10px] text-on-surface-variant uppercase tracking-widest font-bold">Status</th>
                <th class="px-4 py-3 text-left text-[10px] text-on-surface-variant uppercase tracking-widest font-bold">Assigned Trainer</th>
                <th class="px-4 py-3 text-left text-[10px] text-on-surface-variant uppercase tracking-widest font-bold">Actions</th>
              </tr>
            </thead>
            <tbody id="classes-tbody">
              <tr><td colspan="5" class="text-center py-16 text-on-surface-variant">Syncing with schedule...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <div id="assign-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div class="bg-surface border border-outline/60 p-6 w-full max-w-sm space-y-5">
      <h3 class="font-headline font-black text-white text-lg uppercase tracking-tight">Assign Staff Member</h3>
      <select id="trainer-select" class="w-full bg-surface-variant border border-outline/60 text-white text-sm px-3 py-2.5 outline-none focus:border-primary">
        <option value="">Loading trainers...</option>
      </select>
      <div class="flex gap-3">
        <button onclick="closeAssignModal()" class="flex-1 h-10 border border-outline/60 text-xs font-bold uppercase hover:bg-white/5">Cancel</button>
        <button id="modal-confirm" class="flex-1 h-10 bg-primary text-on-primary text-xs font-bold uppercase hover:brightness-110">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pawooalkgiveltrbylqe.supabase.co';
    const SUPABASE_KEY = 'YOUR_ANON_KEY'; 
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let allClasses = [];
    let pendingClassId = null;

    async function init() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.replace('login.html'); return; }
      currentUser = session.user;

      const { data: profile } = await db.from('profiles').select('*').eq('user_id', currentUser.id).single();
      
      if (!profile || profile.role !== 'trainer') {
        window.location.replace('dashboard.html');
        return;
      }

      // Render the specific trainer navbar order
      renderNavbar(profile.role);

      document.getElementById('main-body').classList.remove('hidden-load');
      document.getElementById('header-name').textContent = profile.name;
      document.getElementById('header-avatar-initial').textContent = profile.name.charAt(0).toUpperCase();

      await Promise.all([loadClasses(), loadTrainers()]);
      renderAll();
    }

    function renderNavbar(role) {
      const nav = document.getElementById('main-nav');
      // Force "assign-trainer.html" to be active for Trainer Report and Assignment sub-pages if desired, 
      // or match exact URL
      const currentPath = window.location.pathname.split("/").pop() || "dashboard.html";
      
      const trainerLinks = [
        { name: 'Dashboard', url: 'dashboard.html', icon: 'dashboard' },
        { name: 'Timetable', url: 'Timetable.html', icon: 'calendar_today' },
        { name: 'Trainer Report', url: 'trainer-report.html', icon: 'analytics' },
        { name: 'Profile', url: 'profile.html', icon: 'person' }
      ];

      // Since this is a Staff page, we know they are a trainer, but we use the role logic for safety
      const links = trainerLinks;

      nav.innerHTML = links.map(link => {
        const isActive = currentPath === link.url;
        // Note: Added specific logic so Trainer Report stays active when on this assignment sub-page
        const isAssignmentActive = (link.url === 'trainer-report.html' && currentPath === 'assign-trainer.html');
        
        return `
          <a class="flex items-center gap-2 px-6 h-full transition-all ${isActive || isAssignmentActive ? 'bg-primary text-on-primary font-bold' : 'text-on-surface-variant hover:text-white hover:bg-surface-variant'}" href="${link.url}">
            <span class="material-symbols-outlined" style="font-size: 20px; ${(isActive || isAssignmentActive) ? "font-variation-settings: 'FILL' 1;" : ''}">${link.icon}</span>
            <span class="text-xs uppercase tracking-widest">${link.name}</span>
          </a>
        `;
      }).join('');
    }

    async function loadClasses() {
      const { data } = await db.from('gym_classes').select('*').order('datetime', { ascending: true });
      allClasses = data || [];
    }

    async function loadTrainers() {
      const { data } = await db.from('profiles').select('name').eq('role', 'trainer');
      const sel = document.getElementById('trainer-select');
      sel.innerHTML = '<option value="">Choose a trainer...</option>';
      if (data) {
        data.forEach(t => {
          sel.innerHTML += `<option value="${t.name}">${t.name}</option>`;
        });
      }
    }

    function renderAll() {
      const tbody = document.getElementById('classes-tbody');
      tbody.innerHTML = '';
      
      if (allClasses.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-16 text-on-surface-variant uppercase text-xs tracking-widest">No classes scheduled</td></tr>';
        return;
      }

      allClasses.forEach(cls => {
        const tr = document.createElement('tr');
        tr.className = 'border-b border-white/5 hover:bg-surface-variant/30 transition-colors';
        tr.innerHTML = `
          <td class="px-4 py-4 font-bold text-white uppercase italic tracking-tighter">${cls.name}</td>
          <td class="px-4 py-4 text-xs text-on-surface-variant uppercase">${new Date(cls.datetime).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'})}</td>
          <td class="px-4 py-4"><span class="text-[10px] px-2 py-1 bg-white/10 uppercase font-black tracking-tighter">${cls.status || 'Upcoming'}</span></td>
          <td class="px-4 py-4 text-sm font-bold text-primary uppercase">${cls.trainer_name || '<span class="italic opacity-30 text-white">Unassigned</span>'}</td>
          <td class="px-4 py-4">
            <button onclick="openAssignModal('${cls.id}')" class="px-4 py-2 bg-primary text-black text-[10px] font-black uppercase hover:brightness-110">
              Assign Staff
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openAssignModal(id) {
      pendingClassId = id;
      document.getElementById('assign-modal').classList.remove('hidden');
    }

    function closeAssignModal() {
      document.getElementById('assign-modal').classList.add('hidden');
    }

    document.getElementById('modal-confirm').onclick = async () => {
      const name = document.getElementById('trainer-select').value;
      if (!name) return;

      const { error } = await db.from('gym_classes').update({ trainer_name: name }).eq('id', pendingClassId);
      if (!error) {
        closeAssignModal();
        await loadClasses();
        renderAll();
      } else {
        alert("Error saving: " + error.message);
      }
    };

    document.getElementById('logout-btn').onclick = async () => {
      await db.auth.signOut();
      window.location.replace('login.html');
    };

    init();
  </script>
</body>
</html>
