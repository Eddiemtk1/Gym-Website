<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – GymFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared-supabase.js"></script>
  <script src="auth-role.js"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="shared-theme.js"></script>
  <script id="tailwind-config">
    applyGymflowTailwindConfig();
  </script>
  <link href="shared-theme.css" rel="stylesheet">
</head>

<body class="s14-page s14-auth bg-background text-on-surface font-body antialiased">
  <nav class="flex items-center justify-between border-b border-white/10 px-6 lg:px-10 py-4 bg-background sticky top-0 z-50 s14-topbar">
    <a href="dashboard.html" class="flex items-center gap-2 text-on-surface-variant hover:text-white transition-colors text-xs font-bold uppercase tracking-widest">
      <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
      Back to Home
    </a>
    <div class="flex items-center gap-3 text-primary">
      <div class="size-5">
        <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="currentColor" fill-rule="evenodd" />
        </svg>
      </div>
      <span class="font-headline text-lg font-black text-white tracking-[-0.03em]">GYMFLOW</span>
    </div>
  </nav>

  <div class="min-h-screen grid grid-cols-1 lg:grid-cols-2">

    <div class="hidden lg:flex flex-col justify-between bg-primary p-16 sticky top-0 h-screen s14-auth-hero">
      <div class="flex items-center gap-3">
        <div class="size-8">
          <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="#0e0e0e" fill-rule="evenodd" />
          </svg>
        </div>
        <span class="font-headline text-2xl font-black text-on-primary tracking-[-0.03em]">GYMFLOW</span>
      </div>
      <div>
        <h1 class="font-headline text-7xl font-black text-on-primary leading-none tracking-tighter uppercase italic mb-6">
          Your<br>Best<br>Self<br>Starts<br>Here.
        </h1>
        <p class="text-on-primary/60 text-base max-w-xs">Join thousands of members already tracking their progress and working toward their goals.</p>
      </div>
      <p class="text-on-primary/40 text-xs">© 2026 GymFlow. All rights reserved.</p>
    </div>

    <div class="flex flex-col justify-center min-h-screen px-6 py-16 lg:px-16 overflow-y-auto s14-auth-panel">
      <div class="w-full max-w-md mx-auto s14-auth-form">

        <div class="flex items-center gap-3 mb-12 lg:hidden">
          <div class="size-7 text-primary">
            <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
              <path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="currentColor" fill-rule="evenodd" />
            </svg>
          </div>
          <span class="font-headline text-xl font-black text-white tracking-[-0.03em]">GYMFLOW</span>
        </div>

        <h2 class="font-headline text-3xl font-black text-white uppercase tracking-tight mb-1">Create Account</h2>
        <p class="text-on-surface-variant text-sm mb-10">
          Already a member? <a href="login.html" class="text-primary font-semibold hover:underline">Sign in</a>
        </p>

        <div id="alert" class="hidden mb-6 px-4 py-3 text-sm font-medium border"></div>

        <form id="register-form" class="space-y-5" novalidate>

          <div>
            <label class="block text-[10px] font-bold uppercase tracking-widest text-on-surface-variant mb-2" for="name">Full Name</label>
            <input id="name" type="text" autocomplete="name" placeholder="John Smith"
              class="w-full bg-surface border border-outline px-4 py-3 text-white text-sm placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary transition-colors">
            <p id="name-error" class="hidden text-red-400 text-xs mt-1.5"></p>
          </div>

          <div>
            <label class="block text-[10px] font-bold uppercase tracking-widest text-on-surface-variant mb-2" for="email">Email Address</label>
            <input id="email" type="email" autocomplete="email" placeholder="john@example.com"
              class="w-full bg-surface border border-outline px-4 py-3 text-white text-sm placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary transition-colors">
            <p id="email-error" class="hidden text-red-400 text-xs mt-1.5"></p>
          </div>

          <div>
            <label class="block text-[10px] font-bold uppercase tracking-widest text-on-surface-variant mb-2" for="phone">
              Phone <span class="normal-case tracking-normal font-normal text-on-surface-variant/50">(optional)</span>
            </label>
            <input id="phone" type="tel" autocomplete="tel" placeholder="+44 7700 900000"
              class="w-full bg-surface border border-outline px-4 py-3 text-white text-sm placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary transition-colors">
          </div>

          <div>
            <label class="block text-[10px] font-bold uppercase tracking-widest text-on-surface-variant mb-2" for="password">Password</label>
            <input id="password" type="password" autocomplete="new-password" placeholder="Minimum 8 characters"
              class="w-full bg-surface border border-outline px-4 py-3 text-white text-sm placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary transition-colors">
            <p id="password-error" class="hidden text-red-400 text-xs mt-1.5"></p>
          </div>

          <div>
            <label class="block text-[10px] font-bold uppercase tracking-widest text-on-surface-variant mb-2" for="confirm">Confirm Password</label>
            <input id="confirm" type="password" autocomplete="new-password" placeholder="Repeat your password"
              class="w-full bg-surface border border-outline px-4 py-3 text-white text-sm placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary transition-colors">
            <p id="confirm-error" class="hidden text-red-400 text-xs mt-1.5"></p>
          </div>

          <button id="submit-btn" type="submit"
            class="w-full py-4 mt-2 bg-primary text-on-primary font-headline font-black uppercase tracking-widest text-sm hover:brightness-110 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
            Create Account
          </button>

        </form>
      </div>
    </div>

  </div>

  <script>

    const db = GymflowSupabase.createClient();

    const ui = {
      form: document.getElementById('register-form'),
      submitBtn: document.getElementById('submit-btn'),
      alert: document.getElementById('alert'),
      name: document.getElementById('name'),
      email: document.getElementById('email'),
      phone: document.getElementById('phone'),
      password: document.getElementById('password'),
      confirm: document.getElementById('confirm'),
    };

    const requiredFields = ['name', 'email', 'password', 'confirm'];

    const getHomeRoute = GymflowRoles.getHomeRoute;
    const resolveUserRole = user => GymflowSupabase.resolveUserRole(db, user);

    GymflowSupabase.getSession(db).then(session => {
      if (session) {
        resolveUserRole(session.user).then(role => {
          window.location.replace(getHomeRoute(role));
        });
      }
    });

    function showAlert(message, type = 'error') {
      ui.alert.textContent = message;
      ui.alert.className = type === 'error'
        ? 'mb-6 px-4 py-3 text-sm font-medium border border-red-500/40 bg-red-500/10 text-red-400'
        : 'mb-6 px-4 py-3 text-sm font-medium border border-primary/40 bg-primary/10 text-primary';
      ui.alert.classList.remove('hidden');
    }

    function setButtonState(label, disabled) {
      ui.submitBtn.textContent = label;
      ui.submitBtn.disabled = disabled;
    }

    function setFieldError(fieldId, message) {
      const input = document.getElementById(fieldId);
      const errorEl = document.getElementById(`${fieldId}-error`);
      input.classList.add('border-red-500');
      errorEl.textContent = message;
      errorEl.classList.remove('hidden');
    }

    function clearErrors() {
      requiredFields.forEach(fieldId => {
        const input = document.getElementById(fieldId);
        const errorEl = document.getElementById(`${fieldId}-error`);
        input.classList.remove('border-red-500');
        errorEl.textContent = '';
        errorEl.classList.add('hidden');
      });
      ui.alert.classList.add('hidden');
    }

    function validateForm({ name, email, password, confirm }) {
      let isValid = true;

      if (!name) {
        setFieldError('name', 'Please enter your full name.');
        isValid = false;
      }

      if (!email) {
        setFieldError('email', 'Please enter your email address.');
        isValid = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setFieldError('email', 'Please enter a valid email address.');
        isValid = false;
      }

      if (!password) {
        setFieldError('password', 'Please create a password.');
        isValid = false;
      } else if (password.length < 8) {
        setFieldError('password', 'Use at least 8 characters.');
        isValid = false;
      }

      if (password && password !== confirm) {
        setFieldError('confirm', 'Passwords do not match.');
        isValid = false;
      }

      return isValid;
    }

    ui.form.addEventListener('submit', async event => {
      event.preventDefault();
      clearErrors();

      const formValues = {
        name: ui.name.value.trim(),
        email: ui.email.value.trim(),
        phone: ui.phone.value.trim(),
        password: ui.password.value,
        confirm: ui.confirm.value,
      };

      if (!validateForm(formValues)) return;

      setButtonState('Creating your account...', true);

      const { data, error } = await db.auth.signUp({
        email: formValues.email,
        password: formValues.password,
        options: {
          data: {
            name: formValues.name,
            phone: formValues.phone || null,
            role: 'member',
          },
        },
      });

      if (error) {
        showAlert(error.message);
        setButtonState('Create Account', false);
        return;
      }

      if (data.user) {
        const baseProfile = {
          user_id: data.user.id,
          name: formValues.name,
          email: formValues.email,
          phone: formValues.phone || null,
        };

        const { error: roleProfileError } = await db.from('profiles').upsert({
          ...baseProfile,
          role: 'member',
        }, { onConflict: 'user_id' });

        if (roleProfileError) {
          await db.from('profiles').upsert(baseProfile, { onConflict: 'user_id' });
        }
      }

      ui.form.style.display = 'none';
      showAlert('Account created. Check your inbox to verify your email before signing in.', 'success');
    });
  </script>
</body>

</html>
