<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>GymFlow | Checkout</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#D7FF00",
            "on-primary": "#0e0e0e",
            "background": "#0e0e0e",
            "surface": "#131313",
            "surface-variant": "#1a1a1a",
            "outline": "#404040",
            "on-surface": "#ffffff",
            "on-surface-variant": "#a3a3a3",
          },
          fontFamily: {
            "headline": ["Lexend"],
            "body": ["Inter"],
          },
          borderRadius: { "DEFAULT": "0px" },
        },
      },
    }
  </script>
  <style>
    .kinetic-gradient { background: #D7FF00; }
    .glass-nav { background: rgba(14, 14, 14, 0.8); backdrop-filter: blur(12px); }
  </style>
</head>

<body class="bg-background font-body text-on-surface antialiased overflow-x-hidden">
  <header class="flex items-center justify-between border-b border-white/10 px-6 py-4 lg:px-10 glass-nav sticky top-0 z-50">
    <div class="flex items-center gap-4 text-primary">
      <div class="size-6">
        <svg fill="none" viewBox="0 0 48 48">
          <path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="currentColor" fill-rule="evenodd"></path>
        </svg>
      </div>
      <h2 class="text-white font-headline text-xl font-black leading-tight tracking-[-0.03em]">GYMFLOW</h2>
    </div>
    <a class="flex items-center gap-2 text-on-surface-variant hover:text-white transition-colors text-xs uppercase tracking-widest font-bold" href="membership.html">
      <span class="material-symbols-outlined" style="font-size: 20px;">arrow_back</span>
      <span>Return to Plans</span>
    </a>
  </header>

  <main class="min-h-[calc(100vh-73px)] grid grid-cols-1 lg:grid-cols-12">
    <section class="lg:col-span-5 bg-surface-variant py-12 px-6 lg:px-10 border-r border-white/5">
      <div class="sticky top-28 max-w-lg mx-auto w-full">
        <span class="text-primary font-headline font-bold uppercase tracking-widest text-[10px] mb-4 block">Selected Plan</span>
        <h1 id="summary-plan-name" class="text-white font-headline text-5xl lg:text-6xl font-black leading-none tracking-tighter uppercase italic mb-8">...</h1>
        
        <div class="mb-12">
          <div class="relative aspect-[1.88] mb-6 overflow-hidden border border-white/5">
            <img alt="Gym" class="w-full h-full object-cover opacity-60 grayscale contrast-125" src="images/deadlift.jpg" />
          </div>
          <div class="flex items-baseline gap-2 mb-2">
            <span id="summary-plan-price" class="text-white font-headline text-5xl font-black">£--</span>
            <span class="text-on-surface-variant text-sm font-bold uppercase tracking-widest">/ MONTHLY</span>
          </div>
        </div>
        
        <div class="space-y-8">
          <h3 class="text-white font-headline font-bold uppercase text-base tracking-widest border-b border-white/10 pb-6 italic">Membership Benefits</h3>
          <ul id="summary-plan-benefits" class="space-y-6"></ul>
        </div>
      </div>
    </section>

    <section class="lg:col-span-7 bg-background py-12 px-6 lg:px-10 flex flex-col justify-center">
      <div class="max-w-2xl mx-auto w-full">
        <div class="mb-10">
          <h2 class="text-white font-headline text-3xl font-black tracking-tighter uppercase italic mb-2">Payment Initialisation</h2>
          <p class="text-on-surface-variant">Enter your secure transaction details to finalise activation.</p>
        </div>
        <form id="payment-form" class="space-y-8">
          <div id="payment-element" class="bg-surface border border-white/5 p-4 min-h-[120px]"></div>
          <div id="payment-message" class="hidden text-red-500 text-xs font-bold uppercase tracking-widest mt-2"></div>
          <div class="bg-surface border border-white/5 p-8 space-y-4">
            <div class="flex justify-between items-center text-sm">
              <span class="text-on-surface-variant font-medium">Subscription Plan</span>
              <span id="checkout-plan-name" class="text-white font-bold tracking-wider uppercase">...</span>
            </div>
            <div class="pt-4 border-t border-white/10 flex justify-between items-center mt-4">
              <span class="text-white font-bold uppercase tracking-widest text-xs">Total Due Today</span>
              <span id="checkout-total" class="text-primary font-headline text-3xl font-black">£--.--</span>
            </div>
          </div>
          <button class="w-full py-5 kinetic-gradient text-on-primary font-headline font-black text-lg uppercase tracking-widest italic hover:brightness-110 transition-all flex items-center justify-center gap-3" type="submit">
            <span>Authorise Transaction</span>
            <span class="material-symbols-outlined">bolt</span>
          </button>
        </form>
      </div>
    </section>
  </main>

  <script>
    const supabaseUrl = "https://pawooalkgiveltrbylqe.supabase.co";
    const supabaseKey = "sb_publishable_T-l5NHtJlVXELrzRoeAlzg_bzJ6F2pR";
    const db = supabase.createClient(supabaseUrl, supabaseKey);
    const stripe = Stripe('pk_test_51TTQoLP3N58mW1OAC1buqxRf888Rbqf5kqGApFClbi8NsQVqKRX1dtPHfxot7nwg6bcpEWwGZVpugM1v1XHtEyv400NZQ94v9k');

    document.addEventListener("DOMContentLoaded", async () => {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }

      const urlParams = new URLSearchParams(window.location.search);
      const planId = urlParams.get('plan');
      if (!planId) { window.location.href = 'membership.html'; return; }

      const { data: profile } = await db.from('profiles').select('email').eq('user_id', session.user.id).single();
      const userEmail = profile?.email || session.user.email;

      const { data: plan } = await db.from('membership_plans').select('*').ilike('name', planId).single();
      if (!plan) return;

      document.getElementById("summary-plan-name").innerText = plan.name;
      document.getElementById("summary-plan-price").innerText = `£${plan.price}`;
      document.getElementById("checkout-plan-name").innerText = plan.name;
      document.getElementById("checkout-total").innerText = `£${plan.price}.00`;

      const list = document.getElementById("summary-plan-benefits");
      list.innerHTML = (plan.benefits || []).map(b => `<li class="flex items-center gap-5"><span class="material-symbols-outlined text-primary">check_circle</span><span class="text-white text-lg">${b}</span></li>`).join('');

      try {
        const { data: secretData } = await db.functions.invoke('create-payment-intent', { body: { planId } });
        const elements = stripe.elements({
          clientSecret: secretData.clientSecret,
          appearance: { theme: 'night', variables: { colorPrimary: '#D7FF00', borderRadius: '0px' } }
        });
        const paymentElement = elements.create('payment');
        paymentElement.mount('#payment-element');

        const form = document.getElementById('payment-form');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const btn = form.querySelector('button');
          btn.innerHTML = `<span>PROCESSING</span>`;
          btn.disabled = true;

          const { error } = await stripe.confirmPayment({
            elements,
            confirmParams: {
              return_url: `${window.location.origin}/dashboard.html?success=true&plan=${planId}`,
              receipt_email: userEmail
            }
          });

          if (error) {
            const msg = document.getElementById('payment-message');
            msg.innerText = error.message;
            msg.classList.remove('hidden');
            btn.innerHTML = `<span>Authorise Transaction</span><span class="material-symbols-outlined">bolt</span>`;
            btn.disabled = false;
          }
        });
      } catch (err) { console.error(err); }
    });
  </script>
</body>
</html>
